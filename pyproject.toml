# Proje üst verisi, bağımlılıklar ve araç ayarları tek yerde.
#
# Kurulum (geliştirme):
#   python3.12 -m venv .venv && source .venv/bin/activate
#   pip install -e ".[dev]" -c constraints.txt
#
# Paket şimdilik PyPI'a yayımlanmıyor: içe aktarma adları (`core`, `cities`)
# genel adlardır ve başka paketlerle çakışabilir. Editable kurulum bu depoda
# geliştirme ve testi kolaylaştırmak içindir. requirements.txt aynı listeyi
# Docker ve `pip install -r` kullananlar için tutar; ikisi birlikte güncellenir.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turkiye-heat-risk"
version = "2.1.0"
description = "Landsat, OpenStreetMap ve resmi nüfus verisinden sokak ölçekli, açıklanabilir Isı Hassasiyet Endeksi (HVI)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ayberk Korkmaz" }]
# numpy 2.5 ve rasterio 1.5 (constraints.txt) Python 3.12 ve üstünü ister.
requires-python = ">=3.12"
keywords = ["urban-heat-island", "heat-vulnerability", "landsat", "openstreetmap", "gis", "turkey"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Natural Language :: Turkish",
]
dependencies = [
    "pystac-client>=0.7,<1.0",
    "planetary-computer>=1.0,<2.0",
    "rasterio>=1.3,<2.0",
    "numpy>=1.26,<3.0",
    "geopandas>=0.14,<2.0",
    "shapely>=2.0,<3.0",
    "pyproj>=3.5,<4.0",
    "rasterstats>=0.19,<1.0",
    "folium>=0.16,<1.0",
    "requests>=2.31,<3.0",
    "pandas>=2.0,<4.0",
    "jenkspy>=0.4,<1.0",
    "pyyaml>=6.0,<7.0",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17"]
notebook = ["jupyter>=1.0"]

[project.urls]
Homepage = "https://ayberkrk.github.io/turkiye-heat-risk/"
Repository = "https://github.com/Ayberkrk/turkiye-heat-risk"
Changelog = "https://github.com/Ayberkrk/turkiye-heat-risk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.csv"]

[tool.pytest.ini_options]
# `PYTHONPATH=src` yazmadan `pytest` çalışsın; kök dizin de üst seviye
# betikler (build_docs_index.py vb.) için yolda.
pythonpath = ["src", "."]
testpaths = ["tests"]
