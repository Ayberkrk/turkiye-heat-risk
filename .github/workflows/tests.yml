name: Testler

# Her push ve PR'da tests/ altındaki pytest suite'ini çalıştırır - README'nin
# "Testler" bölümünde belgelenen doğrulama adımı, katkılar (ör. yeni bir
# şehir adaptörü) merge edilmeden önce otomatik uygulanır.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Desteklenen sürümler pyproject.toml'daki requires-python ile aynı.
    # 3.11 yok: constraints.txt'teki numpy 2.5 ve rasterio 1.5 3.12 ister.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Ruff
        run: python -m ruff check .

      - name: pytest
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -v

      - name: Şehir config ve veri tablolarını çevrimdışı doğrula
        run: python validate_city_data.py --all

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker imajını build et
        run: docker build -t turkiye-heat-risk .

      # Gerçek pipeline'ı (Landsat/OSM indirmesi, dakikalarca sürer) CI'da
      # çalıştırmıyoruz - sadece imajın modülü sağlam kurduğunu, network
      # gerektirmeden doğrulayan hafif bir duman testi.
      - name: İçe aktarma duman testi
        run: docker run --rm --entrypoint python turkiye-heat-risk -c "import pipeline"
