city:
  name: "Karaman"
  # İlçe yaş verisinin doğrulandığı kentsel çekirdek ilçeler.
  # bbox: tools/fit_city_bbox.py ile yoğun mahalle kümesinden çizildi (cekirdek); gerçek OSM'de HVI kapsamı %69 (2,092 yol).
  bbox: [33.20, 37.15, 33.25, 37.20]
  crs: "EPSG:32636"
  attribution: "Nüfus: TÜİK ADNKS 2022 (Karaman İŞKUR İl İstihdam ve Mesleki Eğitim Kurulu faaliyet raporu); yaş oranları: il düzeyi TÜİK ADNKS 2025; SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

landsat:
  max_cloud_cover: 30
  max_scenes_per_tile: 3

osm:
  pbf_url: "https://download.openstreetmap.fr/extracts/europe/turkey/central_anatolia-latest.osm.pbf"
  admin_level_ilce: 6
  admin_level_mahalle: 8
  highway_types:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential
    - living_street
    - unclassified
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link

roads:
  buffer_meters: 10

population:
  adapter: "cities.karaman.adapter"
