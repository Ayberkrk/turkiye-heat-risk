city:
  name: "Samsun"
  # 2025 district age counts are verified for the İlkadım urban core.
  # bbox: tools/fit_city_bbox.py ile yoğun mahalle kümesinden çizildi (cekirdek); gerçek OSM'de HVI kapsamı %82 (2,931 yol).
  bbox: [36.30, 41.26, 36.36, 41.32]
  crs: "EPSG:32637"
  attribution: "Nüfus ve yaş grupları: TÜİK ADNKS 2025 (DrDataStats ilçe yaş grubu sorgusu); SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

landsat:
  max_cloud_cover: 30
  max_scenes_per_tile: 3

osm:
  pbf_url: "https://download.openstreetmap.fr/extracts/europe/turkey/black_sea-latest.osm.pbf"
  admin_level_ilce: 6
  admin_level_mahalle: 8
  highway_types:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential
    - living_street
    - unclassified
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link

roads:
  buffer_meters: 10

population:
  adapter: "cities.samsun.adapter"
