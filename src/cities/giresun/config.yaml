  # Merkez kentsel çekirdek bbox; gerçek OSM kapsam ölçümü kayıt sayfasında.
  bbox: [38.365, 40.91, 38.425, 40.99]
  crs: "EPSG:32637"
  attribution: "Nüfus ve yaş grupları: TÜİK ADNKS 2022 (Giresun İŞKUR İl İstihdam ve Mesleki Eğitim Kurulu faaliyet raporu); SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

