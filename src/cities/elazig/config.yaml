city:
  name: "Elazığ"
  # İlçe yaş verisinin doğrulandığı kentsel çekirdek ilçeler.
  # bbox: tools/fit_city_bbox.py ile yoğun mahalle kümesinden çizildi (cekirdek); gerçek OSM'de HVI kapsamı %70 (2,342 yol).
  bbox: [39.20, 38.65, 39.26, 38.70]
  crs: "EPSG:32637"
  attribution: "Nüfus ve yaş grupları: TÜİK ADNKS 2023 (Elazığ İŞKUR İl İstihdam ve Mesleki Eğitim Kurulu faaliyet raporu); SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

landsat:
  max_cloud_cover: 30
  max_scenes_per_tile: 3

osm:
  pbf_url: "https://download.openstreetmap.fr/extracts/europe/turkey/eastern_anatolia-latest.osm.pbf"
  admin_level_ilce: 6
  admin_level_mahalle: 8
  highway_types:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential
    - living_street
    - unclassified
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link

roads:
  buffer_meters: 10

population:
  adapter: "cities.elazig.adapter"
