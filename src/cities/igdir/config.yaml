city:
  name: "Iğdır"
  # İlçe yaş verisinin doğrulandığı kentsel çekirdek ilçeler.
  # bbox: tools/fit_city_bbox.py ile yoğun mahalle kümesinden çizildi (cekirdek); gerçek OSM'de HVI kapsamı %60 (911 yol).
  bbox: [44.02, 39.91, 44.08, 39.95]
  crs: "EPSG:32638"
  attribution: "Nüfus: TÜİK ADNKS 2022 (Iğdır İŞKUR İl İstihdam ve Mesleki Eğitim Kurulu faaliyet raporu); yaş oranları: il düzeyi TÜİK ADNKS 2025; SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

landsat:
  max_cloud_cover: 30
  max_scenes_per_tile: 3

osm:
  pbf_url: "https://download.openstreetmap.fr/extracts/europe/turkey/eastern_anatolia-latest.osm.pbf"
  admin_level_ilce: 6
  admin_level_mahalle: 8
  highway_types:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential
    - living_street
    - unclassified
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link

roads:
  buffer_meters: 10

population:
  adapter: "cities.igdir.adapter"
