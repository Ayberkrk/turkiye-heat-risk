  # Efeler kentsel çekirdek bbox; gerçek OSM kapsam ölçümü kayıt sayfasında.
  bbox: [27.82, 37.83, 27.85, 37.86]
  crs: "EPSG:32635"
  attribution: "Nüfus ve yaş grupları: TÜİK ADNKS 2021 (Aydın İŞKUR İl İstihdam ve Mesleki Eğitim Kurulu faaliyet raporu; rapor yayın yılı 2022); SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

