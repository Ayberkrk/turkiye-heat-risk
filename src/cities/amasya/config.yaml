city:
  name: "Amasya"
  # İlçe yaş verisinin doğrulandığı kentsel çekirdek ilçeler.
  # bbox: tools/fit_city_bbox.py ile yoğun mahalle kümesinden çizildi (tam); gerçek OSM'de HVI kapsamı %90 (1,468 yol).
  bbox: [35.77, 40.59, 35.87, 40.68]
  crs: "EPSG:32636"
  attribution: "Nüfus ve yaş grupları: TÜİK ADNKS 2021 (Amasya İŞKUR İl İstihdam ve Mesleki Eğitim Kurulu faaliyet raporu); SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

landsat:
  max_cloud_cover: 30
  max_scenes_per_tile: 3

osm:
  pbf_url: "https://download.openstreetmap.fr/extracts/europe/turkey/black_sea-latest.osm.pbf"
  admin_level_ilce: 6
  admin_level_mahalle: 8
  highway_types:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential
    - living_street
    - unclassified
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link

roads:
  buffer_meters: 10

population:
  adapter: "cities.amasya.adapter"
