city:
  name: "Bursa"
  # Osmangazi + Nilüfer + Yıldırım kent çekirdeği.
  # bbox: tools/fit_city_bbox.py ile yoğun mahalle kümesinden çizildi (tam); gerçek OSM'de HVI kapsamı %97 (21,857 yol).
  bbox: [28.95, 40.16, 29.19, 40.28]
  crs: "EPSG:32635"
  attribution: "Nüfus ve yaş grupları: TÜİK ADNKS 2023 (Bursa İŞKUR İl İstihdam ve Mesleki Eğitim Kurulu 2023 faaliyet raporu); SEGE-2022: T.C. Sanayi ve Teknoloji Bakanlığı."

landsat:
  max_cloud_cover: 30
  max_scenes_per_tile: 3

osm:
  pbf_url: "https://download.openstreetmap.fr/extracts/europe/turkey/marmara-latest.osm.pbf"
  admin_level_ilce: 6
  admin_level_mahalle: 8
  highway_types:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential
    - living_street
    - unclassified
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link

roads:
  buffer_meters: 10

population:
  adapter: "cities.bursa.adapter"
